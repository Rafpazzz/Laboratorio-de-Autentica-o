spring.application.name=autenticacao
spring.config.import=optional:file:./.env[.properties]

# DB Connection
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:autenticacao}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


logging.level.org.springframework.security=DEBUG

app.security.session.allowed-origin=${SESSION_FRONTEND_ORIGIN:http://localhost:5173}

# Configurações da autenticação por Sessao
server.servlet.session.timeout=${SESSION_TIMEOUT:2h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/


# JWT

app.security.jwt.allowed-origin=${JWT_FRONTEND_ORIGIN:http://localhost:5173}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:2h}
app.security.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}


# OAuth 2.0 / OpenID Connect
app.security.oauth2.allowed-origin=${OAUTH2_FRONTEND_ORIGIN:http://localhost:5173}
app.security.oauth2.frontend-success-url=${OAUTH2_FRONTEND_SUCCESS_URL:http://localhost:5173/oauth2/sobre}
app.security.oauth2.frontend-logout-url=${OAUTH2_FRONTEND_LOGOUT_URL:http://localhost:5173/}

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/auth/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak

spring.security.oauth2.client.provider.keycloak.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8180/realms/autenticacao-lab}


# SAML 2.0

app.security.saml.allowed-origin=${SAML_FRONTEND_ORIGIN:http://localhost:5173}
app.security.saml.frontend-success-url=${SAML_FRONTEND_SUCCESS_URL:http://localhost:5173/saml/sobre}
app.security.saml.frontend-logout-url=${SAML_FRONTEND_LOGOUT_URL:http://localhost:5173/}

spring.security.saml2.relyingparty.registration.keycloak-saml.entity-id=${SAML_SP_ENTITY_ID:autenticacao-lab-saml}
spring.security.saml2.relyingparty.registration.keycloak-saml.acs.location={baseUrl}/login/saml2/sso/{registrationId}
spring.security.saml2.relyingparty.registration.keycloak-saml.signing.credentials[0].private-key-location=${SAML_SP_PRIVATE_KEY:file:./.local/saml/sp-private.key}
spring.security.saml2.relyingparty.registration.keycloak-saml.signing.credentials[0].certificate-location=${SAML_SP_CERTIFICATE:file:./.local/saml/sp-certificate.crt}
spring.security.saml2.relyingparty.registration.keycloak-saml.singlelogout.url={baseUrl}/logout/saml2/slo
spring.security.saml2.relyingparty.registration.keycloak-saml.singlelogout.response-url={baseUrl}/logout/saml2/slo
spring.security.saml2.relyingparty.registration.keycloak-saml.singlelogout.binding=POST
spring.security.saml2.relyingparty.registration.keycloak-saml.assertingparty.metadata-uri=${SAML_IDP_METADATA_URI:http://localhost:8180/realms/autenticacao-lab/protocol/saml/descriptor}
spring.security.saml2.relyingparty.registration.keycloak-saml.assertingparty.singlesignon.sign-request=true
